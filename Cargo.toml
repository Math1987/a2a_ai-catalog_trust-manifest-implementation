[package]
name = "aithos-catalog-signatures"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Experimental signing and verification for two pinned AI Catalog dialects"
license = "Apache-2.0"
publish = false

[features]
default = []
http = ["dep:reqwest"]
cli = ["http", "dep:clap"]

[dependencies]
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
url = "2"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[[bin]]
name = "catalog-signatures"
path = "src/bin/catalog-signatures.rs"
required-features = ["cli"]
